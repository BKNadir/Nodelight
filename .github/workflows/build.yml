name: Build Windows x64 (portable)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this version tag after the build (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

env:
  QT_VERSION: 6.12.0

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.26' }
      - name: Relay tests (race detector)
        working-directory: bridge/relay
        run: go test -race -count=1 ./...

  windows:
    runs-on: windows-2025
    needs: relay-tests
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with: { go-version: '1.26' }

      # Best effort: if this step fails the launcher is simply built without an icon.
      - name: Embed the icon in the launcher
        shell: pwsh
        continue-on-error: true
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          Push-Location bridge/cmd/nodelight
          go-winres simply --icon ../../../assets/icon.png --manifest gui --arch amd64
          Pop-Location
          if (-not (Test-Path bridge/cmd/nodelight/rsrc_windows_amd64.syso)) { Write-Warning 'Nodelight.exe icon was not embedded (go-winres failed)' }

      - name: Build Nodelight.exe (bridge)
        shell: pwsh
        run: ./scripts/build-bridge.ps1

      - name: Download client dependencies
        shell: pwsh
        run: powershell ./setup-deps.ps1

      # Same Qt setup as moonlight-qt's own CI (x64 only).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          tools: tools_qtcreator_gui
          version: ${{ env.QT_VERSION }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Build the client (x64)
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin

      - name: Package portable bundle
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Nodelight-win-x64
          path: dist/Nodelight-win-x64.zip
          if-no-files-found: error

  # Publishes the zip as a GitHub Release, either when a version tag (v0.1.0...) is pushed
  # or when the workflow is started by hand with a "release_tag". The build above is the
  # only source of the release file; nothing is uploaded by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nodelight-win-x64
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Version tags look like v0.1.0 (got '$TAG')"; exit 1;; esac
          mv Nodelight-win-x64.zip "Nodelight-$TAG-win-x64.zip"
          sha256sum "Nodelight-$TAG-win-x64.zip" > SHA256SUMS.txt
          # Versions below 1.0 and versions with a suffix (v0.2.0-beta) are marked as pre-releases.
          flag=""
          case "$TAG" in v0.*|*-*) flag="--prerelease";; esac
          gh release create "$TAG" "Nodelight-$TAG-win-x64.zip" SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Nodelight $TAG" --generate-notes $flag
